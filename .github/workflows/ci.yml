name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  agent:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run abi:check
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      # One web test runs the real agent app behind the proxy, so it needs the agent's packages too.
      - run: npm ci --prefix ../agent
      - run: npm test
  atlas-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install -r scripts/requirements-testnet.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.10.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: forge fmt --check
      - run: forge build
      - run: forge test -vvv
      - name: Check frozen ABI
        working-directory: .
        run: |
          node scripts/abi-signatures.mjs --check contracts/abi/frozen-signatures.txt \
            ILeashVault=contracts/out/LeashVault.sol/LeashVault.json \
            ILeashVaultFactory=contracts/out/LeashVaultFactory.sol/LeashVaultFactory.json \
            IPriceFeed=contracts/out/AtlasRelayFeed.sol/AtlasRelayFeed.json \
            IFaucetToken=contracts/out/MockToken.sol/MockToken.json
